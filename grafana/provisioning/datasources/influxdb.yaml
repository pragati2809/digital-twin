apiVersion: 1

datasources:
  - name: InfluxDB_Flux
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: digital-twin-org
      defaultBucket: machine_data
      tlsSkipVerify: true
    secureJsonData:
      token: my-super-secret-auth-token
